<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicler — GDR Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ═══ TEMI ═══════════════════════════════════════════════════════════════════ */
        :root {
            --font-display: 'Cinzel', serif;
            --font-body: 'Crimson Pro', serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: 0.2s ease;
            --radius: 8px;
            --radius-lg: 14px;
            --sidebar-w: 240px;
        }

        [data-theme="fantasy"] {
            --bg-deep: #0d0a07; --bg-surface: #1a1208; --bg-card: #221a0e; --bg-hover: #2e2210;
            --border: #4a3518; --border-hi: #8a6030; --text-pri: #e8d5a3; --text-sec: #a08850;
            --text-muted: #604830; --accent: #c8922a; --accent-dim: #7a5518; --accent-glow:rgba(200,146,42,0.15);
            --danger: #c0392b; --success: #4a7c40; --info: #2e6e8e; --warn: #9a6e20;
            --dm1: #c8922a; --dm2: #6ea8d4; --shared: #7a5a9a; --private: #4a5a3a;
            --pattern: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%234a3518' fill-opacity='0.25'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        [data-theme="dark"] {
            --bg-deep: #0a0a0c; --bg-surface: #111116; --bg-card: #18181f; --bg-hover: #1e1e28;
            --border: #2a2a38; --border-hi: #4a4a68; --text-pri: #e2e2f0; --text-sec: #8888aa;
            --text-muted: #4a4a64; --accent: #7c6cfc; --accent-dim: #3a3268; --accent-glow:rgba(124,108,252,0.12);
            --danger: #e05560; --success: #50c878; --info: #4a9ed4; --warn: #d4a832;
            --dm1: #7c6cfc; --dm2: #50c878; --shared: #d4a832; --private: #4a9ed4;
            --pattern: none;
        }

        [data-theme="light"] {
            --bg-deep: #f0ede8; --bg-surface: #f8f6f2; --bg-card: #ffffff; --bg-hover: #f0ede8;
            --border: #ddd8d0; --border-hi: #a09880; --text-pri: #2a2420; --text-sec: #6a5e50;
            --text-muted: #9a8e80; --accent: #8b4513; --accent-dim: #e8d8c8; --accent-glow:rgba(139,69,19,0.08);
            --danger: #c0392b; --success: #2e7d32; --info: #1565c0; --warn: #e65100;
            --dm1: #8b4513; --dm2: #1565c0; --shared: #6a1e8a; --private: #2e7d32;
            --pattern: none;
        }

        /* ═══ RESET & BASE ═══════════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: var(--font-body);
            font-size: 16px;
            background: var(--bg-deep);
            color: var(--text-pri);
            transition: background var(--transition), color var(--transition);
        }

        /* ═══ LOGIN SCREEN ════════════════════════════════════════════════════════════ */
        #login-screen {
            position: fixed; inset: 0;
            background: var(--bg-deep);
            background-image: var(--pattern);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; flex-direction: column; gap: 2rem;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 3rem 2.5rem; text-align: center;
            max-width: 380px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-logo { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 0.25rem; }
        .login-subtitle { font-size: 0.85rem; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 2rem; }
        .login-divider { height: 1px; background: var(--border); margin: 1.5rem 0; }
        
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 0.75rem;
            width: 100%; padding: 0.85rem 1.5rem;
            background: var(--bg-surface); border: 1px solid var(--border-hi);
            border-radius: var(--radius); color: var(--text-pri);
            font-family: var(--font-body); font-size: 1rem; cursor: pointer; transition: all var(--transition);
        }
        .btn-google:hover { background: var(--bg-hover); border-color: var(--accent); transform: translateY(-1px); }
        .btn-google svg { width: 20px; height: 20px; }

        /* ═══ LAYOUT PRINCIPALE ══════════════════════════════════════════════════════ */
        #app { display: none; height: 100vh; flex-direction: row; }
        #app.visible { display: flex; }

        /* ═══ SIDEBAR ═════════════════════════════════════════════════════════════════ */
        #sidebar {
            width: var(--sidebar-w); flex-shrink: 0;
            background: var(--bg-surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; background-image: var(--pattern);
        }
        .sidebar-header { padding: 1.25rem 1.25rem 1rem; border-bottom: 1px solid var(--border); }
        .app-logo { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--accent); }
        .app-logo span { color: var(--text-muted); font-size: 0.7rem; display: block; font-family: var(--font-mono); }

        .user-badge { margin-top: 0.75rem; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--bg-deep); font-weight: bold; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .sidebar-nav { flex: 1; overflow-y: auto; padding: 0.75rem 0; }
        .nav-item { padding: 0.6rem 1.25rem; cursor: pointer; color: var(--text-sec); font-size: 0.9rem; transition: all var(--transition); border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background: var(--bg-hover); color: var(--accent); border-left-color: var(--accent); }

        .sidebar-footer { padding: 0.75rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
        .theme-picker { display: flex; gap: 0.2rem; background: var(--bg-card); padding: 0.3rem; border-radius: var(--radius); border: 1px solid var(--border); }
        .theme-btn { flex: 1; font-size: 0.6rem; padding: 0.4rem; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 4px; }
        .theme-btn.active { background: var(--accent); color: var(--bg-deep); }
        .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem; border-radius: var(--radius); cursor: pointer; font-size: 0.8rem; }
        .btn-logout:hover { color: var(--danger); border-color: var(--danger); }

        /* ═══ MAIN CONTENT ════════════════════════════════════════════════════════════ */
        #main { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); }
        .topbar { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--bg-surface); display: flex; align-items: center; }
        .content-area { flex: 1; overflow-y: auto; padding: 2rem; }
        
        h2 { font-family: var(--font-display); margin-bottom: 1rem; color: var(--accent); }
    </style>
</head>
<body data-theme="fantasy">

    <!-- ═══ LOGIN ═══════════════════════════════════════════════════════════════ -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">CHRONICLER</div>
            <div class="login-subtitle">GDR Session Manager</div>
            <div class="login-divider"></div>
            <button class="btn-google" onclick="signInWithGoogle()">
                <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.38-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Accedi con Google
            </button>
        </div>
    </div>

    <!-- ═══ APP STRUCTURE ═══════════════════════════════════════════════════════ -->
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="app-logo">CHRONICLER <span>GDR Session Manager</span></div>
                <div class="user-badge">
                    <div class="user-avatar" id="user-photo">?</div>
                    <div class="user-info">
                        <div class="user-name" id="user-name">Viandante</div>
                        <div class="user-role">Game Master</div>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active">Dashboard</div>
                <div class="nav-item">Sessioni</div>
                <div class="nav-item">Personaggi</div>
                <div class="nav-item">Mappe</div>
            </nav>
            <div class="sidebar-footer">
                <div class="theme-picker">
                    <button class="theme-btn active" onclick="setTheme('fantasy', this)">FANTASY</button>
                    <button class="theme-btn" onclick="setTheme('dark', this)">DARK</button>
                    <button class="theme-btn" onclick="setTheme('light', this)">LIGHT</button>
                </div>
                <button class="btn-logout" onclick="logout()">Esci</button>
            </div>
        </aside>

        <main id="main">
            <header class="topbar">
                <div class="user-name">Dashboard Principale</div>
            </header>
            <div class="content-area">
                <h2>Benvenuto, <span id="welcome-name">...</span></h2>
                <p style="color: var(--text-sec)">Pronto per la prossima avventura?</p>
            </div>
        </main>
    </div>

    <!-- ═══ SCRIPTS ═══════════════════════════════════════════════════════════════ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURAZIONE FIREBASE (Sostituisci questi valori con i tuoi)
        const firebaseConfig = {
            apiKey: "INSERISCI_TUA_API_KEY",
            authDomain: "INSERISCI_TUO_AUTH_DOMAIN",
            projectId: "INSERISCI_TUO_PROJECT_ID",
            storageBucket: "INSERISCI_TUO_STORAGE_BUCKET",
            messagingSenderId: "INSERISCI_SENDER_ID",
            appId: "INSERISCI_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // ESPONI LE FUNZIONI AL WINDOW OBJECT (per poterle usare negli onclick dell'HTML)
        window.signInWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Errore Login:", error);
                alert("Impossibile accedere con Google.");
            }
        };

        window.logout = () => {
            signOut(auth);
        };

        window.setTheme = (theme, btn) => {
            document.body.setAttribute('data-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        // GESTIONE CAMBIO STATO UTENTE
        onAuthStateChanged(auth, (user) => {
            const login = document.getElementById('login-screen');
            const appDiv = document.getElementById('app');
            
            if (user) {
                login.style.display = 'none';
                appDiv.classList.add('visible');
                
                // Aggiorna interfaccia
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('welcome-name').innerText = user.displayName;
                if(user.photoURL) {
                    document.getElementById('user-photo').innerHTML = `<img src="${user.photoURL}">`;
                }
            } else {
                login.style.display = 'flex';
                appDiv.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
